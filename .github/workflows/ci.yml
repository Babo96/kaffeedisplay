name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: make test-host

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Size budget
        run: python3 tools/check_sizes.py
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Check for e2e suite
        id: suite
        shell: bash
        run: |
          if [ -f web/playwright.config.ts ] && [ -d tests/e2e ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "e2e suite not present yet (T-002), skipping"
          fi
      - name: Install Playwright Chromium
        if: steps.suite.outputs.present == 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        if: steps.suite.outputs.present == 'true'
        run: npm --prefix web run e2e

  openapi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user PyYAML==6.0.3
      - run: python3 tools/lint_openapi.py docs/api/openapi.yaml

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_docs.py

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: make fmt-check
      - name: Validate I4 palette layout and matching admin artwork
        run: python3 tools/check_avatar_i4.py
      - name: Confirm generated I4 files match their checked-in source
        run: |
          python3 tools/generate_avatar_art.py
          git diff --exit-code -- firmware/components/ui/src/avatar_art_generated.hpp web/src/components/avatarArt.generated.ts

  simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev zlib1g-dev
      - name: Click/hit-test smoke test
        run: make test-ui
      - name: Deterministic screenshots
        run: make screenshots-check

  preview-container:
    runs-on: ubuntu-24.04
    # Guards tools/preview (browser-accessible simulator). Bounded so a stuck
    # X11/noVNC start fails fast instead of holding the queue.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build browser-accessible LVGL Docker preview
        run: docker build -f tools/preview/Dockerfile -t kaffeekasse-preview .
      - name: Verify nonblack X11 frame and noVNC response
        run: |
          docker run -d --name kaffeekasse-preview -p 127.0.0.1:6080:6080 kaffeekasse-preview
          trap 'docker logs kaffeekasse-preview || true; docker rm -f kaffeekasse-preview || true' EXIT
          for i in $(seq 1 30); do
            if docker exec kaffeekasse-preview python3 tools/preview/check-display.py; then
              curl --fail --silent --show-error http://127.0.0.1:6080/vnc.html > /dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' kaffeekasse-preview)" != "true" ]; then
              echo "LVGL preview container exited unexpectedly" >&2
              exit 1
            fi
            sleep 2
          done
          echo "LVGL interactive preview stayed blank" >&2
          exit 1

  firmware:
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Embed web assets
        run: |
          python3 tools/embed_web.py
          python3 tools/embed_web.py --check
      - name: Build firmware
        run: |
          docker run --rm \
            -v "$PWD/firmware:/project" \
            -w /project \
            espressif/idf:release-v5.5 \
            bash -lc '. "$IDF_PATH/export.sh" && idf.py build'
      - name: Firmware and bundle size budgets
        run: python3 tools/check_sizes.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/*.bin
          if-no-files-found: error
