name: Release

# A release is built from a published GitHub release: the job builds the tagged
# commit, merges a single image that can be flashed at offset 0x0, and attaches
# both binaries (plus checksums and a manifest) to that same release.
#
# Tag pushes alone do not publish anything - creating the release is the
# trigger. `workflow_dispatch` covers a rebuild of an existing tag without
# touching the release notes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and attach the images to (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

# A published release fires once, but a manual dispatch of the same tag must not
# race an in-flight run: both would upload the same asset names.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IDF_IMAGE: espressif/idf:release-v5.5
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Check tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::no tag resolved for this run"
            exit 1
          fi
          case "${TAG}" in
            v*) echo "building release ${TAG} from ${GITHUB_REF}" ;;
            *) echo "::error::tag '${TAG}' does not start with 'v'"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Host tests
        run: make test-host
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Size budget
        run: python3 tools/check_sizes.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Embed web assets
        run: |
          python3 tools/embed_web.py
          python3 tools/embed_web.py --check
      - name: Build firmware
        run: |
          docker run --rm \
            -v "$PWD/firmware:/project" \
            -w /project \
            "$IDF_IMAGE" \
            bash -lc '. "$IDF_PATH/export.sh" && idf.py build'
      - name: Merge flashable image
        run: |
          docker run --rm \
            -v "$PWD/firmware:/project" \
            -w /project \
            "$IDF_IMAGE" \
            bash -lc '. "$IDF_PATH/export.sh" && idf.py merge-bin'
      - name: Verify flashable image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/firmware:/project" \
            -w /project \
            "$IDF_IMAGE" \
            bash -lc '. "$IDF_PATH/export.sh" && esptool.py --chip esp32s3 image_info build/kaffeekasse.bin'
          python3 - <<'PY'
          from pathlib import Path

          app = Path("firmware/build/kaffeekasse.bin")
          merged = Path("firmware/build/merged-binary.bin")
          for path in (app, merged):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty: {path}")

          data = merged.read_bytes()
          # The merged image starts with the bootloader, so byte 0 is the ESP
          # image magic. A merged file without it cannot be flashed at 0x0.
          if data[0] != 0xE9:
              raise SystemExit("merged image does not start with the ESP image magic 0xE9")
          if len(data) > 16 * 1024 * 1024:
              raise SystemExit(f"merged image {len(data)} B exceeds the 16 MiB flash")
          if len(data) <= app.stat().st_size:
              raise SystemExit("merged image is not larger than the app image")

          covered = len(data)
          # storage starts at 0x620000; the merged image must end before it, or
          # flashing a release would overwrite the ledger.
          if covered > 0x620000:
              raise SystemExit(f"merged image covers {covered:#x}, reaches the storage partition")
          print(
              f"merged image ok: {len(data) / 1024:.1f} KiB "
              f"(app {app.stat().st_size / 1024:.1f} KiB), ends at {len(data):#x} < 0x620000"
          )
          PY
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp firmware/build/kaffeekasse.bin release/firmware.bin
          cp firmware/build/merged-binary.bin release/firmware-merged.bin
          (cd release && sha256sum firmware.bin firmware-merged.bin > SHA256SUMS)
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          web = json.loads(Path("firmware/components/webassets/generated/manifest.json").read_text())

          def artifact(name: str) -> dict:
              path = Path("release") / name
              return {
                  "name": name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }

          manifest = {
              "name": "Kaffeekasse",
              "tag": os.environ["TAG"],
              "commit": os.environ.get("GITHUB_SHA", ""),
              "built_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "idf": os.environ.get("IDF_IMAGE", "espressif/idf:release-v5.5"),
              "web_assets": {
                  "count": len(web["assets"]),
                  "gzip_bytes": web["gzip_bytes"],
                  "original_bytes": web["original_bytes"],
              },
              "artifacts": [artifact("firmware.bin"), artifact("firmware-merged.bin")],
              "flash_offsets": {
                  "firmware.bin": "0x20000 (OTA app image)",
                  "firmware-merged.bin": "0x0 (bootloader + partition table + OTA data + app)",
              },
          }
          Path("release/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          cat release/manifest.json
      - name: Size budgets
        run: python3 tools/check_sizes.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Changelog
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="${previous}..HEAD"
            echo "Changes since ${previous}:" > release/CHANGELOG.md
          else
            range="HEAD"
            echo "Initial release." > release/CHANGELOG.md
          fi
          git log --pretty=format:'- %s (`%h`)' "$range" >> release/CHANGELOG.md
          cat >> release/CHANGELOG.md <<'EOF'

          ## Firmware

          | File | Use |
          |---|---|
          | `firmware-merged.bin` | Complete image (bootloader, partition table, OTA data, app). Flash at offset `0x0`; also recovers a blank or bricked device. |
          | `firmware.bin` | App image for the admin UI (System → Firmware upload, OTA). |
          | `SHA256SUMS` | Checksums of both images. |
          | `manifest.json` | Tag, commit, IDF image, web-asset sizes, checksums, flash offsets. |

          Flash the merged image over USB (CH340, `/dev/ttyUSB0`):

          ```sh
          esptool.py --chip esp32s3 -p /dev/ttyUSB0 -b 460800 write_flash 0x0 firmware-merged.bin
          ```

          Flash parameters come from the image headers (`sdkconfig.defaults`:
          16 MiB, QIO, 80 MHz). The merged image ends before `0x620000`, so the
          `storage` partition with the ledger is not touched - flashing a release
          keeps users, products and bookings.
          EOF
          cat release/CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: release/CHANGELOG.md
          # A release created by hand keeps its own notes; the generated
          # changelog and flash instructions are appended below them.
          append_body: true
          files: |
            release/firmware.bin
            release/firmware-merged.bin
            release/SHA256SUMS
            release/manifest.json
            release/CHANGELOG.md
          fail_on_unmatched_files: true
